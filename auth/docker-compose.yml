# auth/docker-compose.yml
version: '3.8'

services:
  # --- Базы данных и кэш для Authentik ---
  postgresql:
    image: postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-please_change_this_password}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s

  # --- Основные компоненты Authentik ---
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-please_change_this_password}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-please_change_this_to_a_long_random_string}
      # Настройки для корректной работы за прокси
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
      AUTHENTIK_WEB__PATH: "/"
      # Начальные данные для администратора (опционально, но удобно)
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASS:-please_change_this_admin_password}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./media:/media
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.plyglo.com`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik.service=authentik"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-please_change_this_password}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-please_change_this_to_a_long_random_string}
    volumes:
      - ./media:/media
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker не должен быть доступен через Traefik
    labels:
      - "traefik.enable=false"

  # --- Прокси-аутпост для интеграции с Traefik (Forward Auth) ---
  authentik-proxy:
    image: ghcr.io/goauthentik/proxy:2025.10
    container_name: authentik-proxy
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: https://auth.plyglo.com
      AUTHENTIK_INSECURE: "false"
      # Токен нужно будет создать в интерфейсе Authentik и вставить сюда
      AUTHENTIK_TOKEN: ${AUTHENTIK_PROXY_TOKEN:-please_generate_token_in_authentik_ui}
      AUTHENTIK_HOST_BROWSER: https://auth.plyglo.com
    networks:
      - platform-network
    labels:
      - "traefik.enable=true"
      # Роутер для самого аутпоста, чтобы Traefik мог к нему обращаться
      - "traefik.http.routers.authentik-proxy.rule=Host(`auth.plyglo.com`) && PathPrefix(`/outpost.goauthentik.io`)"
      - "traefik.http.routers.authentik-proxy.entrypoints=websecure"
      - "traefik.http.routers.authentik-proxy.tls=true"
      - "traefik.http.routers.authentik-proxy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik-proxy.service=authentik-proxy"
      - "traefik.http.services.authentik-proxy.loadbalancer.server.port=9000"
      # Определяем middleware Forward Auth, которое будет использовать Traefik
      - "traefik.http.middlewares.authentik-forwardauth.forwardauth.address=http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik-forwardauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik-forwardauth.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
    depends_on:
      - authentik-server

volumes:
  authentik_postgres_data:
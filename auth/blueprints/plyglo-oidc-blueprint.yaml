# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
# force reapply 2026-10-11
metadata:
  name: "Plyglo OIDC Application"
  labels:
    blueprints.goauthentik.io/description: "Создает OIDC-провайдер и приложение для фронтенда Plyglo"

entries:
  # 1. OAuth2/OpenID Провайдер
  - id: plyglo-oauth2-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: "Plyglo OIDC Provider"
    attrs:
      name: "Plyglo OIDC Provider"
      client_type: public
      client_id: "ID9FYsYcnUzeANxL5larGz4wULb1MaP0korxulss"  # 👈 ЯВНО УКАЗАН
      # client_secret будет сгенерирован автоматически. Его можно будет увидеть в UI.

      # Обязательные потоки (Flow)
      authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
      # Ключ для подписи токенов
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

      # Время жизни токенов
      access_code_validity: "minutes=5"
      access_token_validity: "hours=1"
      refresh_token_validity: "days=30"

      # Разрешенные URL для редиректа (Callback и Silent Renew)
      redirect_uris:
        - url: "https://study.plyglo.com/redirect"
          matching_mode: strict
        - url: "https://study.plyglo.com/auth/callback"
          matching_mode: strict
        - url: "https://study.plyglo.com/auth/silent-renew"
          matching_mode: strict
      # URL для выхода из системы
      post_logout_redirect_uris:
        - url: "https://study.plyglo.com/"
          matching_mode: strict

      # Scopes (маппинги свойств)
      property_mappings:
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
        - !Find [authentik_core.propertymapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]

  # 2. Приложение в Authentik
  - id: plyglo-application
    model: authentik_core.application
    identifiers:
      slug: "plyglo"
    attrs:
      name: "Plyglo Study"
      slug: "plyglo"
      provider: !KeyOf plyglo-oauth2-provider
      meta_launch_url: "https://study.plyglo.com"
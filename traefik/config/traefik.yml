api:
  dashboard: true
  insecure: true      # безопасно, потому что порт слушает только 127.0.0.1

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: platform-network
  file:
    filename: /etc/traefik/config.yml     # ← путь синхронизирован с монтированием

certificatesResolvers:
  letsencrypt:
    acme:
      email: azadorov1234@gmail.com
      storage: /etc/traefik/acme.json
      tlsChallenge: {}

log:
  level: "INFO"
  filePath: "/var/log/traefik/traefik.log"
  format: json

accessLog: {}
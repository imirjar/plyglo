include:
  - auth/docker-compose.yml
  - traefik/docker-compose.yml

services:
  courses-v1:
    image: ghcr.io/imirjar/poliglotim-api:latest
    container_name: poliglotim-api-v1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PORT: "6060"
      DB_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${PLYGLO_DB}
    labels:
      - "traefik.enable=true"
      # Роутер для v1
      - "traefik.http.routers.courses-v1.rule=Host(`api.plyglo.com`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.courses-v1.entrypoints=websecure"
      - "traefik.http.routers.courses-v1.tls=true"
      - "traefik.http.routers.courses-v1.tls.certresolver=letsencrypt"
      - "traefik.http.routers.courses-v1.middlewares=strip-v1,chain-no-auth@file" # chain-api@file можно оставить
      - "traefik.http.services.courses-v1.loadbalancer.server.port=6060"
      # Middleware для удаления префикса /v1
      - "traefik.http.middlewares.strip-v1.stripprefix.prefixes=/v1"
    networks:
      - platform-network

  courses-v2:
    image: ghcr.io/imirjar/poliglotim-api:latest   # замените на ваш новый образ
    container_name: poliglotim-api-v2
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PORT: "6060"
      DB_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${PLYGLO_DB}
    labels:
      - "traefik.enable=true"
      # Роутер для v2
      - "traefik.http.routers.courses-v2.rule=Host(`api.plyglo.com`) && PathPrefix(`/v2`)"
      - "traefik.http.routers.courses-v2.entrypoints=websecure"
      - "traefik.http.routers.courses-v2.tls=true"
      - "traefik.http.routers.courses-v2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.courses-v2.middlewares=strip-v2,chain-api@file"
      - "traefik.http.services.courses-v2.loadbalancer.server.port=6060"
      # Middleware для удаления префикса /v2
      - "traefik.http.middlewares.strip-v2.stripprefix.prefixes=/v2"
    networks:
      - platform-network

  site:
    image: ghcr.io/imirjar/plyglo-website:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`plyglo.com`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.tls.certresolver=letsencrypt"     # ← добавили
      - "traefik.http.routers.site.middlewares=chain-no-auth@file"   # ← публичный
      - "traefik.http.services.site.loadbalancer.server.port=80"     # ← было 443, у вас nginx :80
    networks:
      - platform-network

  app:
    image: ghcr.io/imirjar/plyglo-study:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`study.plyglo.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"      # ← добавили
      - "traefik.http.routers.app.middlewares=chain-no-auth@file"    # ← публичный
      - "traefik.http.services.app.loadbalancer.server.port=80"      # ← Caddy, если редиректит — см. п.5 ниже
    networks:
      - platform-network

  dev: #pls delete it after
    image: ghcr.io/imirjar/plyglo-expo:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      Port: 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dev.rule=Host(`dev.plyglo.com`)"
      - "traefik.http.routers.dev.entrypoints=websecure"
      - "traefik.http.routers.dev.tls=true"
      - "traefik.http.routers.dev.tls.certresolver=letsencrypt"      # ← добавили
      - "traefik.http.routers.dev.middlewares=chain-no-auth@file"    # ← публичный
      - "traefik.http.services.dev.loadbalancer.server.port=3000"      # ← Caddy, если редиректит — см. п.5 ниже
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
services:
  courses-v1:
    image: ghcr.io/imirjar/poliglotim-api:latest
    container_name: courses-v1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PORT: "6060"
      DB_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${PLYGLO_DB}
    labels:
      - "traefik.enable=true"
      # Роутер для v1
      - "traefik.http.routers.courses-v1.rule=Host(`api.plyglo.com`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.courses-v1.entrypoints=websecure"
      - "traefik.http.routers.courses-v1.tls=true"
      - "traefik.http.routers.courses-v1.tls.certresolver=letsencrypt"
      - "traefik.http.routers.courses-v1.middlewares=strip-v1"
      - "traefik.http.services.courses-v1.loadbalancer.server.port=6060"
      # Middleware для удаления префикса /v1
      - "traefik.http.middlewares.strip-v1.stripprefix.prefixes=/v1"
    networks:
      - api-v1-network
